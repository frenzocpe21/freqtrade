# ForeTrade — รันบอทผ่าน Docker (สะอาดสุด ไม่ต้องติดตั้ง Python/TA-Lib บนเครื่อง)
#
# ต้องมี Docker Desktop (Windows/Mac) หรือ Docker Engine (Linux/WSL)
#
# ใช้ผ่าน foretrade_docker.bat หรือสั่งตรง:
#   docker compose -f docker-compose.foretrade.yml up -d       # dry-run เบื้องหลัง
#   docker compose -f docker-compose.foretrade.yml logs -f     # ดู log
#   docker compose -f docker-compose.foretrade.yml down        # หยุด
#
# FreqUI: http://127.0.0.1:8080  (login ตาม config.dry.json)
---
services:
  foretrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: foretrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.dry.json
      --config /freqtrade/user_data/config.docker-override.json
      --strategy MomentumBreakout

  # แดชบอร์ดภาษาไทยของเราเอง (คุยกับบริการ foretrade ผ่าน REST API)
  # เปิดที่ http://127.0.0.1:8099
  foretrade-web:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: foretrade-web
    depends_on:
      - foretrade
    volumes:
      - ".:/app:ro"
    working_dir: /app
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      FREQTRADE_API_URL: "http://foretrade:8080"
      FREQTRADE_USERNAME: "foretrade"
      FREQTRADE_PASSWORD: "CHANGE_ME_password"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8099"
      # ส่งคีย์ AI ผ่าน .env (ถ้าจะใช้ปุ่มวิเคราะห์) - ไม่ตั้งก็รันแดชบอร์ดเฉยๆ ได้
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_LANG: "${AI_LANG:-th}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    entrypoint: ["/bin/sh", "-c"]
    # ติดตั้ง SDK ของ AI (ถ้ามีคีย์จะได้ใช้ปุ่มวิเคราะห์) แล้วรันเซิร์ฟเวอร์
    # ถ้า pip ล้มเหลว ก็ยังรันแดชบอร์ดพื้นฐานได้ (ปุ่ม AI จะขึ้น error)
    # ต้องเป็น list สมาชิกเดียว มิฉะนั้น compose จะตัดคำแล้ว sh -c รับแค่คำแรก
    command:
      - "pip install -q anthropic openai google-genai || true; python -m foretrade_web.server"
